<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>youtublur</title>
  <style>
    :root {
      --surface: #0f0f0f;
      --card: #1c1c1c;
      --text: #f1f1f1;
      --text-sub: #aaaaaa;
      --accent: #FF0033;
      --kbd-bg: #2f2f2f;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --surface: #f9f9f9;
        --card: #ffffff;
        --text: #0f0f0f;
        --text-sub: #606060;
        --kbd-bg: #f1f1f1;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: var(--surface);
      color: var(--text);
      font-family: "Roboto", "Segoe UI", "Yu Gothic UI", "Malgun Gothic", "Microsoft YaHei", system-ui, sans-serif;
      line-height: 1.6;
    }
    main {
      max-width: 480px;
      padding: 32px;
      border-radius: 16px;
      background: var(--card);
      display: flex;
      flex-direction: column;
      gap: 16px;
      text-align: center;
    }
    img { align-self: center; }
    h1 { font-size: 20px; font-weight: 600; }
    p { font-size: 14px; color: var(--text-sub); }
    #welcomeTheaterHint { color: var(--text); font-size: 15px; }
    button {
      align-self: center;
      margin-top: 8px;
      padding: 8px 24px;
      border: none;
      border-radius: 18px;
      background: var(--accent);
      color: #fff;
      font-family: inherit;
      font-size: 14px;
      cursor: pointer;
    }
    button:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
  </style>
</head>
<body>
  <main>
    <img src="icons/icon48.png" width="48" height="48" alt="">
    <h1 id="welcomeTitle"></h1>
    <p id="welcomeTheaterHint"></p>
    <p id="welcomePopupHint"></p>
    <button type="button" id="welcomeClose"></button>
  </main>
  <script src="welcome.js"></script>
</body>
</html>
