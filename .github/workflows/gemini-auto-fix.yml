name: Gemini auto-fix loop

on:
  pull_request_review:
    types: [submitted]
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  auto-fix:
    name: Apply gemini-code-assist suggestions
    runs-on: ubuntu-latest
    if: |
      (
        github.event_name == 'pull_request_review' &&
        github.event.review.user.login == 'gemini-code-assist[bot]' &&
        github.event.review.body != ''
      ) ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request != null &&
        github.event.comment.user.login == 'gemini-code-assist[bot]'
      )
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Resolve PR metadata
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request_review" ]; then
            PR_NUMBER="${{ github.event.pull_request.number }}"
            jq -r '.review.body // ""' "$GITHUB_EVENT_PATH" > /tmp/gemini-review-body.txt
          else
            PR_NUMBER="${{ github.event.issue.number }}"
            jq -r '.comment.body // ""' "$GITHUB_EVENT_PATH" > /tmp/gemini-review-body.txt
          fi
          PR_JSON=$(gh pr view "$PR_NUMBER" --repo "${{ github.repository }}" \
            --json headRefName,headRefOid,labels,commits)
          HEAD_REF=$(echo "$PR_JSON" | jq -r '.headRefName')
          LABELS=$(echo "$PR_JSON" | jq -r '[.labels[].name] | join(",")')
          ITER_COUNT=$(echo "$PR_JSON" | jq -r \
            '[.commits[] | select(.messageHeadline == "chore: apply gemini-code-assist suggestions")] | length')
          echo "pr_number=$PR_NUMBER"   >> "$GITHUB_OUTPUT"
          echo "head_ref=$HEAD_REF"     >> "$GITHUB_OUTPUT"
          echo "labels=$LABELS"         >> "$GITHUB_OUTPUT"
          echo "iter_count=$ITER_COUNT" >> "$GITHUB_OUTPUT"

      - name: Decide whether to skip
        id: gate
        env:
          LABELS: ${{ steps.pr.outputs.labels }}
          ITER_COUNT: ${{ steps.pr.outputs.iter_count }}
        run: |
          set -euo pipefail
          BODY=$(cat /tmp/gemini-review-body.txt 2>/dev/null || echo "")
          skip_reason=""
          if echo ",$LABELS," | grep -q ',gemini-loop-stop,'; then
            skip_reason="gemini-loop-stop label present"
          elif [ "${ITER_COUNT:-0}" -ge 5 ]; then
            skip_reason="iteration limit reached ($ITER_COUNT >= 5)"
          elif echo "$BODY" | grep -qiE '\b(LGTM|no issues found|looks good to me)\b'; then
            skip_reason="convergence keyword detected"
          fi
          echo "::group::Skip decision"
          echo "Body preview: $(echo "$BODY" | head -c 200)"
          echo "Labels: $LABELS"
          echo "Iter count: $ITER_COUNT"
          echo "Skip reason: $skip_reason"
          echo "::endgroup::"
          if [ -n "$skip_reason" ]; then
            echo "skip=true"  >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping auto-fix: $skip_reason"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout PR branch
        if: steps.gate.outputs.skip == 'false'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ steps.pr.outputs.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        if: steps.gate.outputs.skip == 'false'
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Vite+
        if: steps.gate.outputs.skip == 'false'
        uses: voidzero-dev/setup-vp@237a7eda494c3466dcb53e9f067142b9218d64a1 # v1
        with:
          node-version: '22'
          cache: true

      - name: Setup Python
        if: steps.gate.outputs.skip == 'false'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install aider
        if: steps.gate.outputs.skip == 'false'
        run: pip install --no-cache-dir 'aider-chat==0.86.1'

      - name: Install Node deps
        if: steps.gate.outputs.skip == 'false'
        run: pnpm install --frozen-lockfile

      - name: Collect Gemini feedback
        if: steps.gate.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
        run: |
          set -euo pipefail
          BODY=$(cat /tmp/gemini-review-body.txt 2>/dev/null || echo "")
          {
            echo "# Gemini Code Assist review feedback"
            echo
            echo "$BODY"
            echo
            if [ "${{ github.event_name }}" = "pull_request_review" ]; then
              echo "## Inline review comments"
              gh api "repos/${{ github.repository }}/pulls/${PR_NUMBER}/comments" \
                --jq '.[] | select(.user.login == "gemini-code-assist[bot]") |
                  "### \(.path):\(.line // .original_line // "?")\n\n\(.body)\n"'
            fi
          } > /tmp/gemini-feedback.md
          echo "::group::Collected feedback"
          cat /tmp/gemini-feedback.md
          echo "::endgroup::"

      - name: Extract target files from feedback
        if: steps.gate.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
        run: |
          set -euo pipefail
          # Inline commentsからファイルパスを抽出
          if [ "${{ github.event_name }}" = "pull_request_review" ]; then
            gh api "repos/${{ github.repository }}/pulls/${PR_NUMBER}/comments" \
              --jq '[.[] | select(.user.login == "gemini-code-assist[bot]") | .path] | unique[]' \
              > /tmp/target-files.txt 2>/dev/null || true
          fi
          # フィードバック本文からもファイルパスを抽出（.js, .mdファイル）
          grep -oE '[^[:space:]]+\.(js|md|json|yml|yaml)' /tmp/gemini-feedback.md | sort -u >> /tmp/target-files.txt 2>/dev/null || true
          # 存在するファイルのみ残す
          while IFS= read -r file; do
            [ -f "$file" ] && echo "$file"
          done < /tmp/target-files.txt | sort -u > /tmp/files-to-edit.txt
          echo "::group::Files to edit"
          cat /tmp/files-to-edit.txt
          echo "::endgroup::"

      - name: Run aider (with model fallback)
        if: steps.gate.outputs.skip == 'false'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -uo pipefail
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # ファイルリストが空の場合はスキップ
          if [ ! -s /tmp/files-to-edit.txt ]; then
            echo "::warning::No target files identified, skipping aider"
            exit 0
          fi

          run_aider() {
            aider --yes-always --no-stream \
              --model "$1" \
              --message-file /tmp/gemini-feedback.md \
              --auto-commits \
              --commit-prompt "chore: apply gemini-code-assist suggestions" \
              --no-analytics \
              --no-check-update \
              $(cat /tmp/files-to-edit.txt | xargs)
          }

          # より有能力なモデルを試す（フォールバック付き）
          if ! run_aider "openrouter/google/gemini-2.5-flash-preview:free"; then
            echo "::warning::primary model failed; trying gemini-flash"
            if ! run_aider "openrouter/google/gemini-2.0-flash-001:free"; then
              echo "::warning::fallback model failed; trying openrouter/free"
              run_aider "openrouter/openrouter/free"
            fi
          fi

      - name: Lint and test
        if: steps.gate.outputs.skip == 'false'
        run: |
          # aiderでコミットが作成された場合のみlint/testを実行
          if git diff --quiet "origin/${{ steps.pr.outputs.head_ref }}" HEAD; then
            echo "::notice::No changes made, skipping lint and test"
          else
            pnpm exec vp lint
            pnpm test
          fi

      - name: Push and request re-review
        if: steps.gate.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if git diff --quiet "origin/${{ steps.pr.outputs.head_ref }}" HEAD; then
            echo "::notice::No new commits — convergence reached, ending loop"
            exit 0
          fi
          git push origin "HEAD:${{ steps.pr.outputs.head_ref }}"
          gh pr comment "${{ steps.pr.outputs.pr_number }}" \
            --repo "${{ github.repository }}" \
            --body "@gemini-code-assist /gemini review"

      - name: Summarize aider changes
        if: steps.gate.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
        run: |
          set -euo pipefail
          # 変更がある場合のみサマリーを投稿
          if git diff --quiet "origin/${{ steps.pr.outputs.head_ref }}" HEAD; then
            echo "No changes to summarize"
            exit 0
          fi

          # 最新の自動コミット情報を取得
          SUMMARY=$(git log -1 --pretty=format:"## Aider Auto-Fix Summary%n%n**Commit:** %h%n**Message:** %s%n%n### Changed Files:%n" HEAD)
          FILES=$(git diff --stat "origin/${{ steps.pr.outputs.head_ref }}" HEAD | tail -1)

          # 変更ファイルリストを取得
          FILE_LIST=$(git diff --name-only "origin/${{ steps.pr.outputs.head_ref }}" HEAD | sed 's/^/- /')

          # コメント本文を構築
          BODY=$(printf '%s\n\n%s\n\n**Stats:** %s\n\n---\n*Auto-generated by gemini-auto-fix workflow*\n' \
            "$SUMMARY" \
            "$FILE_LIST" \
            "$FILES")

          gh pr comment "$PR_NUMBER" \
            --repo "${{ github.repository }}" \
            --body "$BODY"
