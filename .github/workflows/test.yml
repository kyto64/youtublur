name: Test

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Vite+
      uses: voidzero-dev/setup-vp@v1
      with:
        node-version: '22'
        cache: true

    - name: Install dependencies
      run: npm ci

    - name: Run tests
      run: vp test
