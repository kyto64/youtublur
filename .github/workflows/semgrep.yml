name: Semgrep

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  schedule:
    - cron: '0 15 * * 1'

jobs:
  semgrep:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7.0.1

    - name: Run Semgrep
      uses: semgrep/semgrep-action@v0.58.0
      with:
        config: >-
          p/javascript
          p/secrets
