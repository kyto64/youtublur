name: Verify Actions Lock

# .github/workflows/actions.lock が workflow の uses: と同期しているか、
# ロックされた参照が upstream で検証できるかを確認する。
on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false

    - name: Install gh-actions-lock
      run: gh extension install github/gh-actions-lock

    - name: Verify actions lockfile
      run: gh actions-lock --verify
