name: Merge Dependabot update after checks

on:
  workflow_run:
    # Names, not job names. A matrix (Test's Node legs, E2E's browsers)
    # is still one run of that workflow. conclusion is success only when
    # every job in the run succeeded.
    workflows: [Test, Lint, E2E Tests, Semgrep]
    types: [completed]

permissions:
  # Explicit permissions drop every undeclared scope. Listing Test/Lint/E2E/Semgrep
  # runs needs actions:read; without it, gh run list returns 403 and the job fails
  # before merge.
  actions: read
  contents: write
  pull-requests: write

jobs:
  merge:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch != 'master'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master

      - name: Merge eligible Dependabot PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          PRS=$(gh pr list --repo "$REPOSITORY" --head "$HEAD_BRANCH" --state open --json number,author,body)
          DECISION=$(printf '%s' "$PRS" | node scripts/dependabot-merge.mjs)
          ACTION=$(jq -r '.action' <<<"$DECISION")
          if [ "$ACTION" != "merge" ]; then
            echo "Skipping $HEAD_BRANCH ($(jq -r '.reason' <<<"$DECISION"))."
            exit 0
          fi

          PR_NUMBER=$(jq -r '.number' <<<"$DECISION")

          # A workflow_run event is emitted once per check. Merge only after
          # every required workflow has succeeded for this exact commit.
          for WORKFLOW in Test Lint 'E2E Tests' Semgrep; do
            CONCLUSION=$(gh run list --repo "$REPOSITORY" --workflow "$WORKFLOW" --commit "$HEAD_SHA" --limit 1 --json conclusion --jq '.[0].conclusion // ""')
            if [ "$CONCLUSION" != "success" ]; then
              echo "$WORKFLOW is not successful for $HEAD_SHA ($CONCLUSION); skipping."
              exit 0
            fi
          done

          gh pr merge "$PR_NUMBER" \
            --squash \
            --match-head-commit "$HEAD_SHA" \
            --repo "$REPOSITORY"
