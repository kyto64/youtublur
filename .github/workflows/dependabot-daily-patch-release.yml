name: Dependabot daily patch release

on:
  schedule:
    # Once per day (UTC). Automatic patch release runs at most once per calendar day via this cron.
    - cron: '0 15 * * *'
  workflow_dispatch:

concurrency:
  group: daily-patch-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  patch-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      dispatch_publish: ${{ steps.publish_mode.outputs.dispatch_publish }}
    steps:
      - name: Checkout master
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.RELEASE_PUSH_TOKEN || github.token }}

      - name: Fetch tags from origin
        run: git fetch origin --tags

      - name: Decide if patch release is needed
        id: need
        run: |
          set -euo pipefail
          TAG=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          if [ -z "${TAG}" ]; then
            echo "need_release=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No matching v* tag on master; skipping automated patch release."
            exit 0
          fi
          echo "Latest semver tag: ${TAG}"
          if git diff --quiet "${TAG}"..HEAD -- package.json pnpm-lock.yaml; then
            echo "need_release=false" >> "$GITHUB_OUTPUT"
            echo "No dependency manifest changes since ${TAG}; skipping release."
          else
            echo "need_release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Vite+
        if: steps.need.outputs.need_release == 'true'
        uses: voidzero-dev/setup-vp@237a7eda494c3466dcb53e9f067142b9218d64a1 # v1
        with:
          node-version: '22'
          cache: true

      - name: Install dependencies
        if: steps.need.outputs.need_release == 'true'
        run: pnpm install --frozen-lockfile

      - name: Configure git committer
        if: steps.need.outputs.need_release == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump patch version, changelog, manifest, and tag
        if: steps.need.outputs.need_release == 'true'
        run: pnpm run release -- --release-as patch

      - name: Capture release tag
        if: steps.need.outputs.need_release == 'true'
        id: release
        run: |
          set -euo pipefail
          TAG=$(git describe --tags --abbrev=0 --match 'v*')
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Created release tag: ${TAG}"

      - name: Decide publish trigger mode
        if: steps.need.outputs.need_release == 'true'
        id: publish_mode
        env:
          RELEASE_PUSH_TOKEN: ${{ secrets.RELEASE_PUSH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${RELEASE_PUSH_TOKEN}" ]; then
            echo "dispatch_publish=false" >> "$GITHUB_OUTPUT"
            echo "RELEASE_PUSH_TOKEN is set; tag push should trigger publish.yml."
          else
            echo "dispatch_publish=true" >> "$GITHUB_OUTPUT"
            echo "RELEASE_PUSH_TOKEN is unset; will dispatch publish.yml after push."
          fi

      - name: Push release commit and tags
        if: steps.need.outputs.need_release == 'true'
        run: git push origin master --follow-tags

  # Separate job so a failed dispatch can be re-run without another version bump.
  # Re-running patch-release after a successful push sees no manifest diff and skips.
  dispatch-publish:
    needs: patch-release
    if: needs.patch-release.outputs.dispatch_publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Checkout dispatch script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # workflow_dispatch may start this workflow from a non-master ref.
          # patch-release always releases master, so run that branch's script.
          ref: master
          persist-credentials: false
          fetch-depth: 1

      - name: Dispatch publish workflow
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.patch-release.outputs.tag }}
        run: bash scripts/dispatch-publish.sh
