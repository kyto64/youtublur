name: Dependabot daily patch release

on:
  schedule:
    # Once per day (UTC). Automatic patch release runs at most once per calendar day via this cron.
    - cron: '0 15 * * *'
  workflow_dispatch:

concurrency:
  group: daily-patch-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  patch-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      dispatch_publish: ${{ steps.release_dispatch.outputs.dispatch_publish }}
    steps:
      - name: Detect release App secrets
        id: release_app_config
        env:
          RELEASE_APP_ID: ${{ secrets.RELEASE_APP_ID }}
          RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -n "${RELEASE_APP_ID}" ] && [ -n "${RELEASE_APP_PRIVATE_KEY}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub App token
        id: app_token
        if: steps.release_app_config.outputs.configured == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Resolve release push credentials
        id: release_auth
        env:
          APP_TOKEN: ${{ steps.app_token.outputs.token }}
          RELEASE_PUSH_TOKEN: ${{ secrets.RELEASE_PUSH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${APP_TOKEN}" ]; then
            echo "token=${APP_TOKEN}" >> "$GITHUB_OUTPUT"
            echo "auth_source=app" >> "$GITHUB_OUTPUT"
            echo "tag_push_triggers_publish=true" >> "$GITHUB_OUTPUT"
            echo "Using GitHub App token for checkout and push; tag push triggers publish.yml."
          elif [ -n "${RELEASE_PUSH_TOKEN}" ]; then
            echo "token=${RELEASE_PUSH_TOKEN}" >> "$GITHUB_OUTPUT"
            echo "auth_source=pat" >> "$GITHUB_OUTPUT"
            echo "tag_push_triggers_publish=true" >> "$GITHUB_OUTPUT"
            echo "Using RELEASE_PUSH_TOKEN for checkout and push; tag push triggers publish.yml."
          else
            echo "token=${{ github.token }}" >> "$GITHUB_OUTPUT"
            echo "auth_source=github_token" >> "$GITHUB_OUTPUT"
            echo "tag_push_triggers_publish=false" >> "$GITHUB_OUTPUT"
            echo "No App or PAT secret; will dispatch publish.yml after push (GITHUB_TOKEN tag push does not trigger workflows)."
          fi

      - name: Checkout master
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          fetch-depth: 0
          fetch-tags: true
          token: ${{ steps.release_auth.outputs.token }}

      - name: Fetch tags from origin
        run: git fetch origin --tags

      - name: Decide if patch release is needed
        id: need
        run: node scripts/should-patch-release.mjs

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Vite+
        if: steps.need.outputs.need_release == 'true'
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          # Release stays on one Node line. Latest 22.x satisfies engines
          # ^22.22.2. The Test workflow covers 22.22.2, 24, and 26.
          node-version: '22'
          cache: true

      - name: Install dependencies
        if: steps.need.outputs.need_release == 'true'
        run: pnpm install --frozen-lockfile

      - name: Configure git committer
        if: steps.need.outputs.need_release == 'true'
        env:
          AUTH_SOURCE: ${{ steps.release_auth.outputs.auth_source }}
          GH_TOKEN: ${{ steps.release_auth.outputs.token }}
        run: |
          set -euo pipefail
          if [ "${AUTH_SOURCE}" = "app" ]; then
            BOT_USER_ID=$(gh api /users/youtublur-release-bot%5Bbot%5D --jq .id)
            git config user.name "youtublur-release-bot[bot]"
            git config user.email "${BOT_USER_ID}+youtublur-release-bot[bot]@users.noreply.github.com"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          fi

      - name: Bump patch version, changelog, manifest, and tag
        if: steps.need.outputs.need_release == 'true'
        env:
          NEXT_VERSION: ${{ steps.need.outputs.next_version }}
        run: |
          set -euo pipefail
          if ! [[ "${NEXT_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "unexpected next version: ${NEXT_VERSION}" >&2
            exit 1
          fi
          # Pass the computed patch number. Using the word "patch" as the
          # bump type still follows commit type and can become a minor.
          pnpm exec commit-and-tag-version --release-as "${NEXT_VERSION}"

      - name: Capture release tag
        if: steps.need.outputs.need_release == 'true'
        id: release
        run: |
          set -euo pipefail
          TAG=$(git describe --tags --abbrev=0 --match 'v*')
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Created release tag: ${TAG}"

      - name: Decide publish dispatch after release
        if: steps.need.outputs.need_release == 'true'
        id: release_dispatch
        env:
          TAG_PUSH_TRIGGERS_PUBLISH: ${{ steps.release_auth.outputs.tag_push_triggers_publish }}
        run: |
          set -euo pipefail
          if [ "${TAG_PUSH_TRIGGERS_PUBLISH}" = "true" ]; then
            echo "dispatch_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "dispatch_publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push release commit and tags
        if: steps.need.outputs.need_release == 'true'
        env:
          GH_TOKEN: ${{ steps.release_auth.outputs.token }}
        run: git push origin master --follow-tags

  # Separate job so a failed dispatch can be re-run without another version bump.
  # Re-running patch-release after a successful push sees no releasable
  # commits since the new tag and skips.
  dispatch-publish:
    needs: patch-release
    if: needs.patch-release.outputs.dispatch_publish == 'true' && needs.patch-release.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Checkout dispatch script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # workflow_dispatch may start this workflow from a non-master ref.
          # patch-release always releases master, so run that branch's script.
          ref: master
          persist-credentials: false
          fetch-depth: 1

      - name: Dispatch publish workflow
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.patch-release.outputs.tag }}
        run: bash scripts/dispatch-publish.sh
