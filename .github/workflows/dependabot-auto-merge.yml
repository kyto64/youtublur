name: Dependabot triage and auto-merge

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  metadata:
    name: Fetch update metadata
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.event.pull_request.base.ref == 'master'
    outputs:
      update-type: ${{ steps.dep.outputs.update-type }}
    permissions:
      pull-requests: read
    steps:
      - name: Fetch Dependabot metadata
        id: dep
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

  notify-major:
    name: Notify for semver major
    runs-on: ubuntu-latest
    needs: metadata
    if: needs.metadata.outputs.update-type == 'version-update:semver-major'
    permissions:
      pull-requests: write
    steps:
      - name: Ensure semver-major label exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh label create semver-major --color BD5C00 --description 'Require manual review' --repo "${{ github.repository }}" || true

      - name: Label PR and request review from kyto64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr edit "${{ github.event.pull_request.number }}" \
            --add-label semver-major \
            --add-reviewer kyto64 \
            --repo "${{ github.repository }}"

      - name: Notify kyto64 (opened / reopened only)
        if: github.event.action == 'opened' || github.event.action == 'reopened'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            --body "@kyto64 semver-major dependency update — please review (auto-merge disabled)."

  automerge:
    name: Approve and auto-merge (patch / minor)
    runs-on: ubuntu-latest
    needs: metadata
    if: |
      needs.metadata.outputs.update-type == 'version-update:semver-patch' ||
      needs.metadata.outputs.update-type == 'version-update:semver-minor'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Label patch/minor PRs for post-merge release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create dependabot-auto-release --color 0E8A16 --description 'Post-merge patch release eligible' --repo "${{ github.repository }}" || true
          gh pr edit "${{ github.event.pull_request.number }}" \
            --add-label dependabot-auto-release \
            --repo "${{ github.repository }}"

      - name: Approve and enable auto-merge (squash)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr review "${{ github.event.pull_request.number }}" \
            --approve \
            --body "Automated approve for semver patch/minor Dependabot updates." \
            --repo "${{ github.repository }}"
          gh pr merge "${{ github.event.pull_request.number }}" \
            --auto \
            --squash \
            --repo "${{ github.repository }}"
