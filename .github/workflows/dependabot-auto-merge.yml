name: Dependabot triage

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  metadata:
    name: Fetch update metadata
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.event.pull_request.base.ref == 'master'
    outputs:
      update-type: ${{ steps.dep.outputs.update-type }}
    permissions:
      pull-requests: read
    steps:
      - name: Fetch Dependabot metadata
        id: dep
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

  automerge:
    name: Approve Dependabot update
    runs-on: ubuntu-latest
    needs: metadata
    if: |
      needs.metadata.outputs.update-type == 'version-update:semver-patch' ||
      needs.metadata.outputs.update-type == 'version-update:semver-minor' ||
      needs.metadata.outputs.update-type == 'version-update:semver-major'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Approve update
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr review "${{ github.event.pull_request.number }}" \
            --approve \
            --body "Automated approve for Dependabot updates. CI (Test, Lint, E2E Tests, Semgrep) must pass before merge." \
            --repo "${{ github.repository }}"
