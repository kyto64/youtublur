name: Dependabot triage

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  metadata:
    name: Fetch update metadata
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.event.pull_request.base.ref == 'master'
    outputs:
      update-type: ${{ steps.dep.outputs.update-type }}
    permissions:
      pull-requests: read
    steps:
      - name: Fetch Dependabot metadata
        id: dep
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

  notify-major:
    name: Hold semver major
    runs-on: ubuntu-latest
    needs: metadata
    if: needs.metadata.outputs.update-type == 'version-update:semver-major'
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Ensure major-hold labels exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create needs-ai-review --color 5319E7 --description 'Waiting for an AI review before merge' --repo "${{ github.repository }}" || true
          gh label create dependency-major --color BD5C00 --description 'Dependabot semver-major update' --repo "${{ github.repository }}" || true

      - name: Label the major update
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr edit "${{ github.event.pull_request.number }}" \
            --add-label needs-ai-review \
            --add-label dependency-major \
            --repo "${{ github.repository }}"

      - name: Comment once about the hold
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          MARKER='<!-- dependabot-major-hold -->'
          EXISTING=$(gh api "repos/${REPOSITORY}/issues/${PR_NUMBER}/comments" \
            --jq "[.[] | select(.body | contains(\"dependabot-major-hold\"))] | length")
          if [ "$EXISTING" != "0" ]; then
            echo "Hold comment already present; skipping."
            exit 0
          fi
          BODY=$(printf '%s\n%s' "$MARKER" 'This Dependabot update is `version-update:semver-major`. Auto-merge is disabled. It waits for an AI risk review: the maintainer bot merges low-risk updates and escalates risky ones to kyto.')
          gh pr comment "$PR_NUMBER" \
            --repo "$REPOSITORY" \
            --body "$BODY"

  automerge:
    name: Approve patch / minor update
    runs-on: ubuntu-latest
    needs: metadata
    if: |
      needs.metadata.outputs.update-type == 'version-update:semver-patch' ||
      needs.metadata.outputs.update-type == 'version-update:semver-minor'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Approve update
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr review "${{ github.event.pull_request.number }}" \
            --approve \
            --body "Automated approve for Dependabot updates. CI (Test, Lint, E2E Tests, Semgrep) must pass before merge." \
            --repo "${{ github.repository }}"
