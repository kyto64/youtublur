name: Dependabot patch release

on:
  pull_request:
    types: [closed]

concurrency:
  group: patch-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  patch-release:
    runs-on: ubuntu-latest
    if: |
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'master' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      contains(join(github.event.pull_request.labels.*.name, ','), 'dependabot-auto-release') &&
      !contains(join(github.event.pull_request.labels.*.name, ','), 'semver-major')
    permissions:
      contents: write
    steps:
      - name: Checkout master
        uses: actions/checkout@v6
        with:
          ref: master
          fetch-depth: 0
          # Optional: PAT so tag push triggers publish.yml (GITHUB_TOKEN pushes do not start other workflows).
          token: ${{ secrets.RELEASE_PUSH_TOKEN || github.token }}

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '22'
          cache: true

      - name: Install dependencies
        run: npm ci

      - name: Configure git committer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump patch version, changelog, manifest, and tag
        run: npm run release -- --release-as patch

      - name: Push release commit and tags
        run: git push origin master --follow-tags
