name: E2E Tests

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-e2e:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          # One Node version. This job already matrices chromium/firefox.
          # Latest 22.x satisfies engines ^22.22.2. The Test workflow covers
          # 22.22.2, 24, and 26.
          node-version: '22'
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # chromium は --headless=new でフル Chrome を使うため headless shell は不要（--no-shell）。
      # ダウンロード詰まりで job 全体（10 分）を食わないよう、短い timeout と再試行を付ける。
      - name: Install Playwright Browsers
        timeout-minutes: 5
        run: |
          flags=""
          if [ "${{ matrix.browser }}" = "chromium" ]; then flags="--no-shell"; fi
          for attempt in 1 2 3; do
            if timeout 90 npx playwright install --with-deps $flags ${{ matrix.browser }}; then
              exit 0
            fi
            echo "playwright install failed (attempt ${attempt}/3)"
            sleep $((attempt * 5))
          done
          exit 1

      - name: Run Playwright tests
        run: pnpm run test:e2e --project=${{ matrix.browser }}

      - name: Upload Playwright report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: playwright-report-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 7
