name: Publish extensions (Chrome Web Store & Firefox AMO)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'GitHub Release tag to update (e.g. v1.12.5).'
        required: true
        type: string
      build_from_tag:
        description: 'When true, build the extension from the tagged commit. When false (default), build from master HEAD for latest publish tooling.'
        required: false
        default: false
        type: boolean

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Daily dispatch passes build_from_tag=true. The UI sends a boolean and
          # `gh workflow run -f` sends the string "true"; both are truthy, so this
          # checks out refs/tags/<tag>. Comparing with == true would treat the
          # string "true" as false and build master HEAD instead.
          ref: ${{ github.event_name == 'workflow_dispatch' && (inputs.build_from_tag && format('refs/tags/{0}', inputs.tag) || 'refs/heads/master') || github.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          # Publish stays on one Node line. Latest 22.x satisfies engines
          # ^22.22.2. The Test workflow covers 22.22.2, 24, and 26.
          node-version: '22'
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linter
        run: vp lint

      - name: Run tests
        run: vp test

      - name: Create zip
        run: |
          zip -r extension.zip \
            manifest.json \
            storage-mode.js \
            shortcut-actions.js \
            background.js \
            content.js \
            style.css \
            popup.html \
            popup.js \
            popup-shortcuts.js \
            popup-color.js \
            review-nudge.js \
            onboarding.js \
            welcome.html \
            welcome.js \
            _locales/ \
            icons/
          cp extension.zip extension-firefox.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          files: |
            extension.zip
            extension-firefox.zip
          generate_release_notes: true

      - name: Upload & Publish to Chrome Web Store
        env:
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          CWS_ZIP_PATH: extension.zip
          CWS_PUBLISH: 'true'
        run: node scripts/publish-chrome-webstore.mjs

      - name: Upload to Firefox AMO (listed)
        if: ${{ vars.AMO_PUBLISH == 'true' }}
        uses: browser-actions/release-firefox-addon@f8026bff59385bee825dbf33b0887570f196f804 # v0.2.1
        with:
          addon-id: ${{ secrets.AMO_ADDON_ID }}
          addon-path: extension-firefox.zip
          channel: listed
          compatibility-firefox-min: '109.0'
          release-note: 'Release ${{ github.event_name == ''workflow_dispatch'' && inputs.tag || github.ref_name }}. See GitHub Release for assets and notes.'
          auth-api-issuer: ${{ secrets.AMO_JWT_ISSUER }}
          auth-api-secret: ${{ secrets.AMO_JWT_SECRET }}
