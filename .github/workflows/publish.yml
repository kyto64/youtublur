name: Publish extensions (Chrome Web Store & Firefox AMO)

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '22'
          cache: true

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: vp lint

      - name: Run tests
        run: vp test

      - name: Create zip
        run: |
          zip -r extension.zip \
            manifest.json \
            content.js \
            style.css \
            popup.html \
            popup.js \
            _locales/ \
            icons/
          cp extension.zip extension-firefox.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            extension.zip
            extension-firefox.zip
          generate_release_notes: true

      - name: Upload & Publish to Chrome Web Store
        env:
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          CWS_ZIP_PATH: extension.zip
          CWS_PUBLISH: 'true'
        run: node scripts/publish-chrome-webstore.mjs

      - name: Upload to Firefox AMO (listed)
        if: ${{ vars.AMO_PUBLISH == 'true' }}
        uses: browser-actions/release-firefox-addon@v0.2.1
        with:
          addon-id: ${{ secrets.AMO_ADDON_ID }}
          addon-path: extension-firefox.zip
          channel: listed
          compatibility-firefox-min: '109.0'
          release-note: 'Release ${{ github.ref_name }}. See GitHub Release for assets and notes.'
          auth-api-issuer: ${{ secrets.AMO_JWT_ISSUER }}
          auth-api-secret: ${{ secrets.AMO_JWT_SECRET }}
