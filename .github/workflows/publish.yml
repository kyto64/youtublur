name: Publish extensions (Chrome Web Store & Firefox AMO)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'GitHub Release tag to update (e.g. v1.12.5). Extension is built from master (publish tooling).'
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'refs/heads/master' || github.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@237a7eda494c3466dcb53e9f067142b9218d64a1 # v1
        with:
          node-version: '22'
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linter
        run: vp lint

      - name: Run tests
        run: vp test

      - name: Create zip
        run: |
          zip -r extension.zip \
            manifest.json \
            storage-mode.js \
            content.js \
            style.css \
            popup.html \
            popup.js \
            _locales/ \
            icons/
          cp extension.zip extension-firefox.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          files: |
            extension.zip
            extension-firefox.zip
          generate_release_notes: true

      - name: Upload & Publish to Chrome Web Store
        env:
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          CWS_ZIP_PATH: extension.zip
          CWS_PUBLISH: 'true'
        run: node scripts/publish-chrome-webstore.mjs

      - name: Upload to Firefox AMO (listed)
        if: ${{ vars.AMO_PUBLISH == 'true' }}
        uses: browser-actions/release-firefox-addon@f8026bff59385bee825dbf33b0887570f196f804 # v0.2.1
        with:
          addon-id: ${{ secrets.AMO_ADDON_ID }}
          addon-path: extension-firefox.zip
          channel: listed
          compatibility-firefox-min: '109.0'
          release-note: 'Release ${{ github.event_name == ''workflow_dispatch'' && inputs.tag || github.ref_name }}. See GitHub Release for assets and notes.'
          auth-api-issuer: ${{ secrets.AMO_JWT_ISSUER }}
          auth-api-secret: ${{ secrets.AMO_JWT_SECRET }}
