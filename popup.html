<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>youtublur</title>
  <style>
    body {
      min-width: 220px;
      max-width: 320px;
      padding: 12px 16px;
      font-family: "Segoe UI", "Yu Gothic UI", "Malgun Gothic", "Microsoft YaHei", "PingFang SC", "PingFang TC", sans-serif;
      font-size: 13px;
      color: #0f0f0f;
      margin: 0;
    }
    h3 {
      margin: 0 0 12px 0;
      font-size: 14px;
      font-weight: 600;
    }
    .option {
      display: flex;
      align-items: center;
      padding: 8px 0;
      cursor: pointer;
      border-radius: 4px;
    }
    .option:hover {
      background-color: #f1f1f1;
    }
    .option input {
      margin: 0 10px 0 0;
      cursor: pointer;
    }
    .option label {
      cursor: pointer;
      flex: 1;
    }
    .separator {
      border: 0;
      border-top: 1px solid #eee;
      margin: 12px 0;
    }
    #reloadButton {
      justify-content: center;
      font-weight: 500;
      padding: 8px 0;
    }
  </style>
</head>
<body>
  <h3 id="popupHeading"></h3>
  <div class="option">
    <input type="radio" name="bgMode" id="modeBlur" value="blur">
    <label for="modeBlur" id="labelModeBlur"></label>
  </div>
  <div class="option">
    <input type="radio" name="bgMode" id="modeSolid" value="solid">
    <label for="modeSolid" id="labelModeSolid"></label>
  </div>
  <hr class="separator">
  <div id="reloadButton" class="option">
    <span id="labelReload"></span>
  </div>
  <script src="popup.js"></script>
</body>
</html>
